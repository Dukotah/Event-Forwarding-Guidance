title: 'NSA Event Forwarding Guidance - Account Usage: Account Name Changed'
id: 319c6d28-59cc-5e8b-974a-18a5dc0b8a5e
status: experimental
description: 'Recommended event to collect: Account Name Changed (Security, event ID 4781). The name of an account was changed. Category guidance: User account information can be collected and audited. Tracking local account usage can help detect Pass the Hash activity and other unauthorized account usage. Additional information such as remote desktop logins, users added to privileged groups, and account lockouts can also be tracked. User accounts being promoted to privileged groups should be audited very closely to ensure that users are in fact supposed to be in a privileged group. Unauthorized membership in privileged groups is a strong indicator that malicious activity has occurred. Lockout events for domain accounts are generated on the domain controller whereas lockout events for local accounts are generated on the local computer.'
references:
- https://github.com/nsacyber/Event-Forwarding-Guidance/blob/master/Events/README.md
author: Generated from nsacyber/Event-Forwarding-Guidance Events/RecommendedEvents.json
date: '2026-11-17'
