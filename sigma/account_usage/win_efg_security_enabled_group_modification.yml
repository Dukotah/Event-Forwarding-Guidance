title: 'NSA Event Forwarding Guidance - Account Usage: Security-Enabled group Modification'
id: 641c8931-91af-5ad5-bb24-37e1af9e0dea
status: experimental
description: 'Recommended event to collect: Security-Enabled group Modification (Security, event ID 4735). Category guidance: User account information can be collected and audited. Tracking local account usage can help detect Pass the Hash activity and other unauthorized account usage. Additional information such as remote desktop logins, users added to privileged groups, and account lockouts can also be tracked. User accounts being promoted to privileged groups should be audited very closely to ensure that users are in fact supposed to be in a privileged group. Unauthorized membership in privileged groups is a strong indicator that malicious activity has occurred. Lockout events for domain accounts are generated on the domain controller whereas lockout events for local accounts are generated on the local computer.'
references:
