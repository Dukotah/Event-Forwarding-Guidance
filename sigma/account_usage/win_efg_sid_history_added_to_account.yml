title: 'NSA Event Forwarding Guidance - Account Usage: SID History added to Account'
id: be69d8f4-b2cc-5686-adb2-b290bfa30ae2
status: experimental
description: 'Recommended event to collect: SID History added to Account (Security, event ID 4765). SID History was added to an account. Category guidance: User account information can be collected and audited. Tracking local account usage can help detect Pass the Hash activity and other unauthorized account usage. Additional information such as remote desktop logins, users added to privileged groups, and account lockouts can also be tracked. User accounts being promoted to privileged groups should be audited very closely to ensure that users are in fact supposed to be in a privileged group. Unauthorized membership in privileged groups is a strong indicator that malicious activity has occurred. Lockout events for domain accounts are generated on the domain controller whereas lockout events for local accounts are generated on the local computer.'
references:
- https://github.com/nsacyber/Event-Forwarding-Guidance/blob/master/Events/README.md
