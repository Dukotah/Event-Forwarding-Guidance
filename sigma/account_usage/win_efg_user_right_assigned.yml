title: 'NSA Event Forwarding Guidance - Account Usage: User Right Assigned'
id: a1c509f6-f953-54d2-a5cf-183c9f31fd29
status: experimental
description: 'Recommended event to collect: User Right Assigned (Security, event ID 4704). A user right was assigned. Category guidance: User account information can be collected and audited. Tracking local account usage can help detect Pass the Hash activity and other unauthorized account usage. Additional information such as remote desktop logins, users added to privileged groups, and account lockouts can also be tracked. User accounts being promoted to privileged groups should be audited very closely to ensure that users are in fact supposed to be in a privileged group. Unauthorized membership in privileged groups is a strong indicator that malicious activity has occurred. Lockout events for domain accounts are generated on the domain controller whereas lockout events for local accounts are generated on the local computer.'
references:
- https://github.com/nsacyber/Event-Forwarding-Guidance/blob/master/Events/README.md
