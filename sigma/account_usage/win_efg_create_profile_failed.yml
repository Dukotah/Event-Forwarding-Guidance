title: 'NSA Event Forwarding Guidance - Account Usage: Create Profile failed'
id: 7ee93c08-3f57-55e8-9a46-57f908466ee4
status: experimental
description: 'Recommended event to collect: Create Profile failed (Application, event ID 1518). Cannot Create profile, using temporary profile. Category guidance: User account information can be collected and audited. Tracking local account usage can help detect Pass the Hash activity and other unauthorized account usage. Additional information such as remote desktop logins, users added to privileged groups, and account lockouts can also be tracked. User accounts being promoted to privileged groups should be audited very closely to ensure that users are in fact supposed to be in a privileged group. Unauthorized membership in privileged groups is a strong indicator that malicious activity has occurred. Lockout events for domain accounts are generated on the domain controller whereas lockout events for local accounts are generated on the local computer.'
references:
- https://github.com/nsacyber/Event-Forwarding-Guidance/blob/master/Events/README.md
author: Generated from nsacyber/Event-Forwarding-Guidance Events/RecommendedEvents.json
date: '2026-11-17'
