title: 'NSA Event Forwarding Guidance - Mobile Device Activities: Wireless Authentication Started and Failed'
id: 8ba00313-9067-535e-ab25-445c1908656d
status: experimental
description: 'Recommended event to collect: Wireless Authentication Started and Failed (Microsoft-Windows-WLAN-AutoConfig/Operational, event ID 12011, 12012, 12013). Category guidance: Wireless devices are ubiquitious and the need to record an enterprise''s wireless device activities may be critical. A wireless device could become compromised while traveling between different networks, regardless of the protocol used for communication (e.g., 802.11 or Bluetooth). Therefore, the tracking of which networks mobile devices are entering and exiting is useful to prevent further compromises. The creation frequency of the following events depend on how often the device disconnects and reconnects to a wireless network. Each event below provides mostly similar information with the exception that additional fields have been added to certain events.'
references:
- https://github.com/nsacyber/Event-Forwarding-Guidance/blob/master/Events/README.md
