title: 'NSA Event Forwarding Guidance - Mobile Device Activities: Starting a Wireless connection'
id: 90a1b950-67f7-58a3-849f-4cb2994f9526
status: experimental
description: 'Recommended event to collect: Starting a Wireless connection (Microsoft-Windows-WLAN-AutoConfig/Operational, event ID 8000, 8011). Category guidance: Wireless devices are ubiquitious and the need to record an enterprise''s wireless device activities may be critical. A wireless device could become compromised while traveling between different networks, regardless of the protocol used for communication (e.g., 802.11 or Bluetooth). Therefore, the tracking of which networks mobile devices are entering and exiting is useful to prevent further compromises. The creation frequency of the following events depend on how often the device disconnects and reconnects to a wireless network. Each event below provides mostly similar information with the exception that additional fields have been added to certain events.'
references:
- https://github.com/nsacyber/Event-Forwarding-Guidance/blob/master/Events/README.md
