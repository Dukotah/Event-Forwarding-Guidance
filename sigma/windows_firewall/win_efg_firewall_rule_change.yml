title: 'NSA Event Forwarding Guidance - Windows Firewall: Firewall Rule Change'
id: bc7173a2-5162-5672-9172-dc7216dccbc2
status: experimental
description: 'Recommended event to collect: Firewall Rule Change (Microsoft-Windows-Windows Firewall With Advanced Security/Firewall, event ID 2005). Category guidance: If client workstations are taking advantage of the built-in host-based Windows Firewall, then there is value in collecting events to track the firewall status. For example, if the firewall state changes from on to off, then that log should be collected. Normal users should not be modifying the firewall rules of their local machine. The below events for the listed versions of the Windows operating system are only applicable to modifications of the local firewall settings.'
