title: 'NSA Event Forwarding Guidance - System or Service Failures: Windows Service Fails or Crashes'
id: e21bbb1c-6277-5ab7-aed7-0bffa0d406be
status: experimental
description: 'Recommended event to collect: Windows Service Fails or Crashes (System, event ID 7022, 7023, 7024, 7026, 7031, 7032, 7034). Category guidance: System and Services failures are interesting events that may need to be investigated. Service operations normally do not fail. If a service fails, then it may be of concern and should be reviewed by an administrator. If a Windows service continues to fail repeatedly on the same machines, then this may indicate that an attacker is targeting a service.'
