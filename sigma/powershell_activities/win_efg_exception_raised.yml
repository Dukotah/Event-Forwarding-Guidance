description: 'Recommended event to collect: Exception Raised (Microsoft-Windows-Powershell/Operational, event ID 4103). PowerShell exception raised. Category guidance: PowerShell events can be interesting as Powershell is included by default in modern Windows installations. If a PowerShell script is failing, it may indicate misconfiguration, missing files, or malicious activity. Use of the Get-MessageTrackingLog cmdlet can be used to enumerate Exchange Server mail metadata, returning detailed information about the history of each mail message traveling through the server.'
