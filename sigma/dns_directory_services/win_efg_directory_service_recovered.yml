title: 'NSA Event Forwarding Guidance - DNS/Directory Services: Directory service recovered'
id: a92a25bc-af17-509c-b8a8-5afa4347abb3
status: experimental
description: 'Recommended event to collect: Directory service recovered (Security, event ID 5138). A directory service object was undeleted. Category guidance: Malicious or misused software can often attempt to resolve blacklisted or suspicious domain names. The collection of DNS queries and responses are recommended in order to enable discovery of compromise or intrusion through security analytics. A number of the below event IDs will only be recorded with enhanced auditing enabled. See [Network Forensics with Windows DNS Analytical Logging](http://blogs.technet.com/b/teamdhcp/archive/2015/11/24/network-forensics-with-windows-dns-analytical-logging.aspx) for more information.'
