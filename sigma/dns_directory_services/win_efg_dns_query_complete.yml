title: 'NSA Event Forwarding Guidance - DNS/Directory Services: DNS Query Complete'
id: 191957dc-fc14-5ae9-b706-524a8c002198
status: experimental
description: 'Recommended event to collect: DNS Query Complete (Microsoft-Windows-DNS-Client/Operational, event ID 3008). DNS query completed (Application DNS Lookup). Category guidance: Malicious or misused software can often attempt to resolve blacklisted or suspicious domain names. The collection of DNS queries and responses are recommended in order to enable discovery of compromise or intrusion through security analytics. A number of the below event IDs will only be recorded with enhanced auditing enabled. See [Network Forensics with Windows DNS Analytical Logging](http://blogs.technet.com/b/teamdhcp/archive/2015/11/24/network-forensics-with-windows-dns-analytical-logging.aspx) for more information.'
