title: 'NSA Event Forwarding Guidance - Software and Service Installation: Service Start Failure'
id: 3db40bd9-2239-50be-ac21-2e98d179f306
status: experimental
description: 'Recommended event to collect: Service Start Failure (System, event ID 7000). Service Start Failure. Category guidance: As part of normal network operations, new software and services will be installed, and there is value in monitoring this activity. Administrators can review these logs for newly installed software or system services and verify that they do not pose a risk to the network. It should be noted that an additional Program Inventory event ID 800 is generated daily on Windows 7 at 12:30 AM to provide a summary of application activities (e.g., number of new application installations). Event ID 800 is generated on Windows 8 as well under different circumstances. This event is beneficial to administrators seeking to identify the number of applications that were installed or removed on a machine.'
