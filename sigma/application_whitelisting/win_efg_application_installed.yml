title: 'NSA Event Forwarding Guidance - Application Whitelisting: Application Installed'
id: 4e399efa-d095-5e92-966c-0b4fb6583ed4
status: experimental
description: 'Recommended event to collect: Application Installed (Microsoft-Windows-AppLocker/Packaged app-Deployment, event ID 8023). Modern app install. Category guidance: Application whitelisting events should be collected to look for applications that have been blocked from execution. Any blocked applications could be malware or users trying to run unapproved software. Software Restriction Policies (SRP) is supported on Windows XP and above. The AppLocker feature is available for Windows 7 and above Enterprise and Ultimate editions only. Application Whitelisting events can be collected if SRP or AppLocker are actively being used on the network.'
references:
- https://github.com/nsacyber/Event-Forwarding-Guidance/blob/master/Events/README.md
author: Generated from nsacyber/Event-Forwarding-Guidance Events/RecommendedEvents.json
date: '2026-11-17'
tags:
- detection.threat-hunting
logsource:
  product: windows
  service: applocker
detection:
