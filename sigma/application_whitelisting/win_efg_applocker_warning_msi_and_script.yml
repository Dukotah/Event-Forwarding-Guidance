description: 'Recommended event to collect: AppLocker Warning (Microsoft-Windows-AppLocker/MSI and Script, event ID 8006). Would have been blocked if rules were enforced. Audit only mode. Category guidance: Application whitelisting events should be collected to look for applications that have been blocked from execution. Any blocked applications could be malware or users trying to run unapproved software. Software Restriction Policies (SRP) is supported on Windows XP and above. The AppLocker feature is available for Windows 7 and above Enterprise and Ultimate editions only. Application Whitelisting events can be collected if SRP or AppLocker are actively being used on the network.'
