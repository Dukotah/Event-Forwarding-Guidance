title: 'NSA Event Forwarding Guidance - Application Whitelisting: Application Ran'
id: ee89f391-3699-5c7f-9254-e6185eaaca98
status: experimental
description: 'Recommended event to collect: Application Ran (Microsoft-Windows-AppLocker/Packaged app-Execution, event ID 8020). Modern app run. Category guidance: Application whitelisting events should be collected to look for applications that have been blocked from execution. Any blocked applications could be malware or users trying to run unapproved software. Software Restriction Policies (SRP) is supported on Windows XP and above. The AppLocker feature is available for Windows 7 and above Enterprise and Ultimate editions only. Application Whitelisting events can be collected if SRP or AppLocker are actively being used on the network.'
references:
