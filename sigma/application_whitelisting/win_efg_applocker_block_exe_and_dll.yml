description: 'Recommended event to collect: AppLocker Block (Microsoft-Windows-AppLocker/EXE and DLL, event ID 8004). Blocked. Enforce rules mode only. Category guidance: Application whitelisting events should be collected to look for applications that have been blocked from execution. Any blocked applications could be malware or users trying to run unapproved software. Software Restriction Policies (SRP) is supported on Windows XP and above. The AppLocker feature is available for Windows 7 and above Enterprise and Ultimate editions only. Application Whitelisting events can be collected if SRP or AppLocker are actively being used on the network.'
