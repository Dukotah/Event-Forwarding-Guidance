title: 'NSA Event Forwarding Guidance - Clearing Event Logs: Event Log Service Shutdown'
id: 002ca85e-d99f-50ca-b902-2ee14b228665
status: experimental
description: 'Recommended event to collect: Event Log Service Shutdown (Security, event ID 1100). (Security Log) Event Log Service Shutdown. Category guidance: It is unlikely that event log data would be cleared during normal operations and it is likely that a malicious attacker may try to cover their tracks by clearing an event log. When an event log gets cleared, it is suspicious. Centrally collecting events has the added benefit of making it much harder for an attacker to cover their tracks. Event forwarding permits sources to forward multiple copies of a collected event to multiple collectors thus enabling redundant event collection. Using a redundant event collection model can minimize the single point of failure risk.'
references:
