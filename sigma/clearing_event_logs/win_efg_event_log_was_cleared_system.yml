title: 'NSA Event Forwarding Guidance - Clearing Event Logs: Event Log was Cleared (System)'
id: 88c6bdb4-c9e5-56fd-9d1f-da1fdea0a1f7
status: experimental
description: 'Recommended event to collect: Event Log was Cleared (System, event ID 104). Category guidance: It is unlikely that event log data would be cleared during normal operations and it is likely that a malicious attacker may try to cover their tracks by clearing an event log. When an event log gets cleared, it is suspicious. Centrally collecting events has the added benefit of making it much harder for an attacker to cover their tracks. Event forwarding permits sources to forward multiple copies of a collected event to multiple collectors thus enabling redundant event collection. Using a redundant event collection model can minimize the single point of failure risk.'
references:
