title: 'NSA Event Forwarding Guidance - External Media Detection: New Mass Storage Installation'
id: 78ce0c1d-3af5-5dfe-8e46-4daa5becfe44
status: experimental
description: 'Recommended event to collect: New Mass Storage Installation (Microsoft-Windows-Kernel-PnP/Configuration, event ID 400, 410). This event is generated for any USB device being inserted into any USB port (2.0 or 3.0). However, this event is only generated once (the first time the device is introduced to the system. Category guidance: Detection of USB device (e.g., mass storage devices) usage is important in some environments, such as air gapped networks. This section attempts to take the proactive avenue to detect USB insertion at real-time. Event ID 43 only appears under certain circumstances. The following events and event logs are only available in Windows 8 and above. Microsoft-Windows-USB-USBHUB3-Analytic is not an event log per se; it is a trace session log that stores tracing events in an Event Trace Log (.etl) file. The events created by Microsoft-Windows-USB-USBHUB3 publisher are sent to a direct channel (i.e., Analytic log) and cannot be subscribed to for event collection.
  Administrators should seek an alternative method of collecting and analyzing this event (43).'
